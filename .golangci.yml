version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - revive
    - misspell
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      # 与 `make fmt`（goimports -local）保持一致：本地包单独成组
      local-prefixes:
        - github.com/example/go-web-template

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
