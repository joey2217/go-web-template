services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    # 开发用默认密码 redis；生产请改成强密码（可通过 .env 注入 REDIS_PASSWORD
    # 并把下面写死改成 ${REDIS_PASSWORD}，app 的 APP_REDIS_PASSWORD 同步对齐）
    command: ["redis-server", "--requirepass", "redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:4
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:postgres@postgres:5432/app?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  go-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_APP_ENV: prod
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_USER: postgres
      APP_DATABASE_PASSWORD: postgres
      APP_DATABASE_NAME: app
      APP_DATABASE_SSLMODE: disable
      APP_REDIS_ADDR: redis:6379
      APP_REDIS_PASSWORD: redis
      APP_METRICS_USERNAME: metrics
      APP_METRICS_PASSWORD: metrics
      APP_LOG_FORMAT: json
      APP_SWAGGER_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
