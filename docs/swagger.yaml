basePath: /
definitions:
  github_com_example_go-web-template_internal_dto.CreatePostRequest:
    properties:
      author:
        example: alice
        maxLength: 64
        type: string
      content:
        example: post content
        type: string
      status:
        enum:
        - 0
        - 1
        example: 0
        type: integer
      title:
        example: Hello World
        maxLength: 255
        type: string
    required:
    - author
    - content
    - title
    type: object
  github_com_example_go-web-template_internal_dto.CreateUserRequest:
    properties:
      email:
        example: alice@example.com
        maxLength: 128
        type: string
      nickname:
        example: Alice
        maxLength: 64
        type: string
      status:
        enum:
        - 0
        - 1
        example: 0
        type: integer
      username:
        example: alice
        maxLength: 64
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  github_com_example_go-web-template_internal_dto.PostResponse:
    properties:
      author:
        example: alice
        type: string
      content:
        example: post content
        type: string
      created_at:
        type: string
      id:
        example: 0191f0a0-0000-7000-8000-000000000000
        type: string
      status:
        example: 0
        type: integer
      title:
        example: Hello World
        type: string
      updated_at:
        type: string
    type: object
  github_com_example_go-web-template_internal_dto.UpdatePostRequest:
    properties:
      author:
        example: alice
        maxLength: 64
        type: string
      content:
        example: post content
        type: string
      status:
        enum:
        - 0
        - 1
        example: 1
        type: integer
      title:
        example: Hello World
        maxLength: 255
        type: string
    required:
    - author
    - content
    - title
    type: object
  github_com_example_go-web-template_internal_dto.UpdateUserRequest:
    properties:
      email:
        example: alice@example.com
        maxLength: 128
        type: string
      nickname:
        example: Alice
        maxLength: 64
        type: string
      status:
        enum:
        - 0
        - 1
        example: 0
        type: integer
    type: object
  github_com_example_go-web-template_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: alice@example.com
        type: string
      id:
        example: 0191f0a0-0000-7000-8000-000000000000
        type: string
      nickname:
        example: Alice
        type: string
      status:
        example: 0
        type: integer
      updated_at:
        type: string
      username:
        example: alice
        type: string
    type: object
  github_com_example_go-web-template_pkg_response.Body:
    properties:
      code:
        description: 业务错误码，0 表示成功
        type: integer
      data:
        description: 业务数据
      message:
        description: 提示信息
        type: string
      request_id:
        description: 请求 ID，便于排查
        type: string
    type: object
  github_com_example_go-web-template_pkg_response.PageData:
    properties:
      list: {}
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: Go Web 模板：Gin + GORM + PostgreSQL
  title: go-web-template API
  version: "1.0"
paths:
  /api/v1/posts:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 100
        in: query
        name: page_size
        type: integer
      - description: 标题/内容关键字
        in: query
        name: keyword
        type: string
      - description: 状态：0 草稿，1 已发布
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_example_go-web-template_pkg_response.Body'
            - properties:
                data:
                  $ref: '#/definitions/github_com_example_go-web-template_pkg_response.PageData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_pkg_response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_example_go-web-template_pkg_response.Body'
      summary: 分页查询帖子
      tags:
      - posts
    post:
      consumes:
      - application/json
      parameters:
      - description: 帖子信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_example_go-web-template_internal_dto.CreatePostRequest'
